<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delayed CSS Loader</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111216;
        }
        .loader {
            width: 70px;
            height: 70px;
            border: 8px solid #2a2d38;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            opacity: 0; 
            animation: 
                spin 1.2s linear infinite, 
                fadeIn 0.5s ease-out forwards;
            animation-delay: 0s, 3s; 
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="loader"></div>

</body>
</html>
