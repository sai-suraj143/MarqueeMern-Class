<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Letter S</title>
    <style>
        /* Center the grid on the screen for presentation */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            font-family: sans-serif;
        }

        /* The Grid Container */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(5, 60px);
            gap: 10px; /* Space between the boxes */
        }

        /* Base style for all grid items */
        .box {
            background-color: transparent;
            border-radius: 2px;
        }

        /* Style for the boxes that make up the 'S' */
        .fill {
            background-color: #ff4757; /* Vibrant red/pink color */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="box fill"></div>
        <div class="box fill"></div>
        <div class="box fill"></div>

        <div class="box fill"></div>
        <div class="box"></div>
        <div class="box"></div>

        <div class="box fill"></div>
        <div class="box fill"></div>
        <div class="box fill"></div>

        <div class="box"></div>
        <div class="box"></div>
        <div class="box fill"></div>

        <div class="box fill"></div>
        <div class="box fill"></div>
        <div class="box fill"></div>
    </div>

</body>
</html>
