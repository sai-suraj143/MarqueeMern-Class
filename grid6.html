<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            grid-template-rows: 80px 1fr 60px;
            grid-template-areas: 
                "head head head"
                "side mukhya right"
                "foot foot foot";
            gap: 12px;
            height: 100vh;
        }
        .header{
            grid-area: head;
            background-color: lightslategray;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sidebar{
            grid-area: side;
            background-color: lightslategray;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main{
            grid-area: mukhya;
            background-color: lightslategray;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .aside{
            grid-area: right;
            background-color: lightslategray;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .footer{
            grid-area: foot;
            background-color: lightslategray;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main</div>
        <div class="aside">Aside</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
