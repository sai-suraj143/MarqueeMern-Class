<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic light</title>
    <style>
        #baseContainer{
            height: 500px;
            width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            background-color: black;
            padding: 20px;
        }
        #circle1{
            border-radius: 50%;
            height: 120px;
            width: 120px;
            background-color: red;
        }
        #circle2{
            border-radius: 50%;
            height: 120px;
            width: 120px;
            background-color: rgb(204, 204, 0);
        }
        #circle3{
            border-radius: 50%;
            height: 120px;
            width: 120px;
            background-color: rgb(0, 160, 0);
        }
    </style>
</head>
<body>
    <div id="baseContainer">
        <div id="circle1"></div>
        <div id="circle2"></div>
        <div id="circle3"></div>
    </div>
</body>
</html>
