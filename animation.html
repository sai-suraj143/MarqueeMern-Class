        body{
            height: 100vh;

        h1, h2{
            position: relative;
        }
        h1::before{
            content: "";
            height: 4px;
            width: 0%;
            background: red;
            position: absolute;
            bottom: 0%;
            transition: all ease 0.4s;
            left: 50%;
        }

        h1:hover::before{
            width: 50%;    
            
        }
        h1::after{
            content: "";
            height: 4px;
            width: 0%;
            background-color: red;
            position: absolute;
            bottom: 0%;
            transition: all ease 0.4s;
            right: 50%;
        }
        h1:hover::after{
            width: 50%;
        }

        h2::after{
            content: "";
            background-color: red;
            height: 2px;
            width: 0%;
            position: absolute;
            bottom: 0%;
            transition: all .5s ease;
            left: 0%;
        }
        h2:hover::after{
            width: 100%;
        }
    </style>
    
</head>
