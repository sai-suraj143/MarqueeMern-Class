<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        html,body{
            width: 100%;
            height: 100%;
        }
        body{

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            height: 300px;
            width: 300px;
            background: lightgrey;
            transition: transform 0.3s ease;
        }
        .box:hover{
            transform: translateX(800px);
            
        }
    </style>
</head>
<body>
    <div class="box">
        Kuch bhi
    </div>
</body>
</html>
