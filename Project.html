<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5; /* Added a soft background color */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Added a clean font */
        }

        .container {
            position: relative; /* Vital for keeping the absolute profile pic contained */
            height: 700px;
            width: 450px; /* Slightly narrowed for standard card proportions */
            background-color: white;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); /* Added subtle shadow instead of a harsh border */
            overflow: hidden;
        }

        #image-container {
            height: 250px;
            width: 100%;
            background-color: rgb(165, 47, 239);
            display: flex;
            justify-content: center;
        }

        #profile-pic {
            border-radius: 50%;
            height: 200px;
            width: 200px;
            background-color: bisque;
            position: absolute;
            top: 100px; /* Positioned perfectly between header and body */
            border: 4px solid white; /* Adds a nice cutout effect */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #description-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 120px; /* Pushes content down to make room for profile pic */
            width: 100%;
        }

        .text {
            text-align: center;
            margin-bottom: 20px;
        }

        .text h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .text h5 {
            color: #777;
            font-size: 16px;
            font-weight: 500;
        }

        .social-icons {
            display: flex;
            justify-content: space-evenly;
            width: 250px;
            margin-bottom: 30px;
        }

        /* Icon Styling */
        .social-icons i {
            font-size: 22px;
            color: #555;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-icons i:hover {
            color: lightskyblue;
            transform: scale(1.2); /* Slight pop effect on hover */
        }

        .btns {
            display: flex;
            justify-content: space-evenly;
            width: 300px;
            margin-bottom: 40px;
        }

        /* Button Styling */
        .btn {
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-subscribe {
            background-color: rgb(165, 47, 239);
            color: white;
            box-shadow: 0 4px 6px rgba(255, 0, 0, 0.2);
        }

        .btn-subscribe:hover {
            background-color: #cc0000;
            box-shadow: 0 6px 8px rgba(255, 0, 0, 0.3);
        }

        .btn-message {
            background-color: rgb(165, 47, 239);
            color: #fff;
            border: 2px solid #ddd;
        }

        .btn-message:hover {
            background-color: #f4f4f4;
            border-color: #ccc;
        }

        .footer-stats {
            display: flex;
            justify-content: space-evenly;
            width: 350px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #555;
            font-weight: bold;
        }

        .stat i {
            margin-bottom: 5px;
            font-size: 20px;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="image-container">
            <div id="profile-pic"></div>
        </div>
        
        <div id="description-box">
            <div class="text">
                <h1>CodingLab</h1>
                <h5>YouTube & Blogger</h5>
            </div>
            
            <div class="social-icons">
                <i class="fab fa-facebook-f"></i>
                <i class="fab fa-twitter"></i>
                <i class="fab fa-instagram"></i>
                <i class="fab fa-youtube"></i>
            </div>
            
            <div class="btns">
                <button class="btn btn-subscribe">Subscribe</button>
                <button class="btn btn-message">Message</button>
            </div>
            
            <div class="footer-stats">
                <div class="stat">
                    <i class="fas fa-heart"></i>
                    <span>60k</span>
                </div>
                <div class="stat">
                    <i class="fas fa-comment"></i>
                    <span>20k</span>
                </div>
                <div class="stat">
                    <i class="fas fa-share"></i>
                    <span>12k</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
