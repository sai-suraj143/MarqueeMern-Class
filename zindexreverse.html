<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --main-color: rgb(20, 35, 246);
            --main_height: 170px;
            --main-width : 170px;
        }
        body{
            height: 100vh;
            width: 100vw;
        }
        .box{
            height: var(--main_height);
            width: var(--main-width);
            background-color: var(--main-color);
            border: 2px solid black;
        }
        .box1{
            margin: 0;
            position: absolute;
            z-index: 2;
        }
        .box2{
            margin: 1vw ;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1;
        }
        .box3{
            margin: 2vw ;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 0;
        }
        .box4{
            margin: 3vw ;
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: -1;
        }
        .box5{
            margin: 4vw ;
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: -2;
        }
    </style>
</head>
<body>
    <div class="box1 box"></div> 
    <div class="box2 box"></div> 
    <div class="box3 box"></div> 
    <div class="box4 box"></div> 
    <div class="box5 box"></div> 
</body>
</html>
