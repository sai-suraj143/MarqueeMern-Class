<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="brand-section">
                <div class="logo-fk">
                    <span class="fk-f"></span><span class="fk-text"></span>
                </div>
                <div class="logo-travel">
                    <i class="fa-solid fa-plane"></i> Travel
                </div>
            </div>

            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" placeholder="Search for Products, Brands and More">
            </div>

            <div class="nav-actions">
                <div class="location-picker">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Select delivery location</span>
                    <i class="fa-solid fa-chevron-down arrow"></i>
                </div>
                
                <div class="login-menu">
                    <i class="fa-regular fa-circle-user"></i>
                    <span>Login</span>
                    <i class="fa-solid fa-chevron-down arrow"></i>
                    <div class="login-tooltip">Login</div>
                </div>

                <div class="nav-item">
                    <span>More</span>
                    <i class="fa-solid fa-chevron-down arrow"></i>
                </div>

                <div class="nav-item cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart</span>
                </div>
            </div>
        </div>
    </header>

    <nav class="categories-bar">
        <div class="category-item active">
            <div class="cat-icon bg-yellow"><i class="fa-solid fa-bag-shopping"></i></div>
            <span>For You</span>
        </div>
        <div class="category-item">
            <div class="cat-icon"><i class="fa-solid fa-shirt"></i></div>
            <span>Fashion</span>
        </div>
        <div class="category-item">
            <div class="cat-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
            <span>Mobiles</span>
        </div>
        <div class="category-item">
            <div class="cat-icon"><i class="fa-solid fa-sparkles"></i></div>
            <span>Beauty</span>
        </div>
        <div class="category-item">
            <div class="cat-icon"><i class="fa-solid fa-laptop"></i></div>
            <span>Electronics</span>
        </div>
        <div class="category-item">
            <div class="cat-icon"><i class="fa-solid fa-couch"></i></div>
            <span>Home</span>
        </div>
        <div class="category-item">
            <div class="cat-icon"><i class="fa-solid fa-tv"></i></div>
            <span>Appliances</span>
        </div>
        <div class="category-item">
            <div class="cat-icon"><i class="fa-solid fa-teddy-bear"></i></div>
            <span>Toys, baby...</span>
        </div>
    </nav>

    <main class="banner-section">
        <div class="banner banner-tcl">
            <div class="banner-content">
                <span class="badge"></span>
                <h3></h3>
                <h1></h1>
                <h2></h2>
                <p></p>
            </div>
            <div class="banner-img">
                <div class="mock-tv"></div>
            </div>
            <span class="ad-tag"></span>
        </div>

        <div class="banner banner-nova">
            <div class="banner-content">
                <span class="badge"></span>
                <h3><sup></sup></h3>
                <h1></h1>
                <p></p>
            </div>
            <div class="banner-img">
                <div class="mock-phone"></div>
            </div>
            <span class="ad-tag"></span>
        </div>

        <div class="banner banner-vibe">
            <div class="banner-content">
                <h3></h3>
                <h1></h1>
                <p></p>
            </div>
        </div>
    </main>

    <section class="interesting-finds">
        <h2>Interesting finds</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="prod-img"></div>
                <p>Clothing</p>
            </div>
            <div class="product-card">
                <div class="prod-img"></div>
                <p>Drones & Toys</p>
            </div>
            <div class="product-card">
                <div class="prod-img"></div>
                <p>Feature Phones</p>
            </div>
            <div class="product-card">
                <div class="prod-img"></div>
                <p>Mens T-Shirts</p>
            </div>
        </div>
    </section>

</body>
</html>
