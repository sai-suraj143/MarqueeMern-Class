<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 250px;
            width: 1000px;
            background-color: lightpink;
            
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: lightblue;
            border: 1px solid red;
            display: inline-block;
        }
        #child1{
            padding: 10px;
            height: 100px;
            width: 950px;
            margin: 10px;
            display: flex;
            justify-content: space-evenly;
        }
        #child2{
            height: 100px;
            width: 780px;
        }
        #child3{
            height: 100px;
            width:200px;

        }
        .inChild1{
            
            height: 80px;
            width: 100px;
            border: 2px solid black;
            background-color: cornflowerblue;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="child1" class="box">
            <div class="inChild1"></div>
            <div class="inChild1"></div>
            <div class="inChild1"></div>
            <div class="inChild1"></div>
            
            
        </div>
        <div id="child2" class="box"></div>
        <div id="child3" class="box"></div>
    </div>
</body>
</html>
